<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .author {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 18px;
            border-radius: 50px;
        }

        .author span {
            font-weight: 600;
        }

        .author a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .author a:hover {
            color: white;
        }

        .chat-section {
            padding: 20px;
            height: 75vh;
        }

        flowise-fullchatbot {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .chat-section {
                height: 70vh;
            }

            .author {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Supply Chain Chatbot</h1>

            <p>
                Intelligent Supply Chain Assistant powered by Flowise AI
            </p>

            <div class="author">
                <span>Developed by Kool-Cool</span>
                <a href="https://github.com/Kool-Cool" target="_blank">
                    GitHub ↗
                </a>
            </div>
        </div>

        <div class="chat-section">
            <flowise-fullchatbot></flowise-fullchatbot>
        </div>

    </div>

    <script type="module">
        import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

        Chatbot.initFull({
            chatflowid: "30db7cce-16e8-4ed1-b555-01796c687693",
            apiHost: "https://cloud.flowiseai.com",
        })
    </script>

</body>
</html>
